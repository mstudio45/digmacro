name: Build Binaries Using Launcher

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Build Branch'
        required: false
        default: 'main'
      version:
        description: 'Build Version'
        required: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            runs_on: ubuntu-latest
          - os: windows-latest
            arch: x64
            runs_on: windows-latest
          - os: macos-latest
            arch: x64
            runs_on: macos-13
          - os: macos-latest
            arch: arm64
            runs_on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.8'
          architecture: ${{ matrix.arch }}

      - name: Build for Windows
        if: startsWith(matrix.os, 'windows')
        run: |
          $branch = "${{ github.event.inputs.branch || github.ref_name }}"
          $version = "${{ github.event.inputs.version }}"

          (Get-Content scripts\launcher_build\win.bat) -replace 'MATRIX.BRANCH', '$branch' | Set-Content scripts\launcher_build\win.bat
          (Get-Content scripts\launcher_build\win.bat) -replace 'MATRIX.VERSION', '$version' | Set-Content scripts\launcher_build\win.bat

          scripts\launcher_build\win.bat ${{ matrix.arch }}

      - name: Build for macOS
        if: startsWith(matrix.os, 'macos')
        run: |
          BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
          VERSION="${{ github.event.inputs.version }}"

          sed -i '' "s/MATRIX.VERSION/${VERSION}/g" scripts/launcher_build/macos.sh
          sed -i '' "s/MATRIX.BRANCH/${BRANCH}/g" scripts/launcher_build/macos.sh

          sh scripts/launcher_build/macos.sh ${{ matrix.arch }}
  
      - name: Build for Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
          VERSION="${{ github.event.inputs.version }}"

          sed -i "s/MATRIX.VERSION/${VERSION}/g" scripts/launcher_build/linux.sh
          sed -i "s/MATRIX.BRANCH/${BRANCH}/g" scripts/launcher_build/linux.sh

          sh scripts/launcher_build/linux.sh ${{ matrix.arch }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: digmacro-${{ startsWith(matrix.os, 'ubuntu') && 'linux' || (startsWith(matrix.os, 'windows') && 'windows' || 'macos') }}-${{ matrix.arch == 'x64' && 'x86_64' || matrix.arch }}
          path: output/
